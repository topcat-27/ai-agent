services:
  anthropic-mock:
    image: node:24.16.0-alpine3.22@sha256:191c9f0080fcbbc6547a85dc0ff7988072214a355aabdc1d2ec55a7dae5eea8a
    command:
      - node
      - /opt/phase4-test/anthropic-mock.mjs
    volumes:
      - ./tests/phase4/anthropic-mock.mjs:/opt/phase4-test/anthropic-mock.mjs:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3401/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  n8n:
    depends_on:
      anthropic-mock:
        condition: service_healthy
    volumes:
      - ./tests/phase3/fixtures:/opt/phase3-test/fixtures:ro
      - ./tests/phase4/workflows:/opt/phase4-test/workflows:ro
